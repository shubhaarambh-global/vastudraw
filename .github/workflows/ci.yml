name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: corepack enable
      - run: python -m venv .venv
      - run: . .venv/bin/activate && python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - run: pnpm install --frozen-lockfile=false
      - run: ./scripts/validate.sh
